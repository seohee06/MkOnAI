<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>룸메이트온 (One-Room Way) - 첫 독립 가구 맞춤형 예산 관리</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-light: #EEF2FF;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-700: #374151;
            --gray-900: #111827;
            --danger: #EF4444;
            --success: #10B981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.6;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header {
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .badge {
            display: inline-block;
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.8rem;
            color: var(--gray-900);
            margin-bottom: 0.25rem;
        }
        .author {
            color: var(--gray-700);
            font-size: 1rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .card {
            background: var(--gray-100);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--gray-200);
        }
        .card h3 {
            font-size: 0.9rem;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
        }
        .card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        section {
            margin-bottom: 2.5rem;
        }
        h2 {
            font-size: 1.3rem;
            color: var(--primary);
            border-bottom: 1px solid var(--gray-200);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .form-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        input, select {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--gray-200);
            border-radius: 6px;
            font-size: 1rem;
        }
        input[type="text"], input[type="number"] {
            flex: 1;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
            font-size: 0.95rem;
        }
        th {
            background-color: var(--gray-100);
            font-weight: 600;
        }
        .btn-del {
            background-color: var(--danger);
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
        }
        .settings-box {
            background: var(--primary-light);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <span class="badge">One-Room Way</span>
                <h1>룸메이트온: 첫 독립 가구 예산 및 품목 관리</h1>
                <div class="author">개발자: 서수정</div>
            </div>
        </header>

        <!-- 예산 및 설정 영역 -->
        <section class="settings-box">
            <div>
                <label><strong>총 예산 (원):</strong></label>
                <input type="number" id="totalBudget" value="3000000" onchange="updateBudget()">
            </div>
            <div>
                <label><strong>이사 예정일:</strong></label>
                <input type="date" id="movingDate" onchange="updateBudget()">
            </div>
            <div id="ddayDisplay" style="font-weight: bold; color: var(--primary);"></div>
        </section>

        <!-- 대시보드 요약 -->
        <div class="dashboard-grid">
            <div class="card">
                <h3>총 예산</h3>
                <div class="value" id="viewTotal">3,000,000원</div>
            </div>
            <div class="card">
                <h3>실제 총 지출</h3>
                <div class="value" id="viewSpent" style="color: var(--danger);">0원</div>
            </div>
            <div class="card">
                <h3>남은 예산</h3>
                <div class="value" id="viewRemain" style="color: var(--success);">3,000,000원</div>
            </div>
        </div>

        <!-- 품목 추가 및 관리 -->
        <section>
            <h2>구매 품목 및 예산 관리</h2>
            <div class="form-group">
                <input type="text" id="itemName" placeholder="품목명 (예: 세탁기, 매트리스)">
                <select id="itemCategory">
                    <option value="가전">가전</option>
                    <option value="가구">가구</option>
                    <option value="생활용품">생활용품</option>
                    <option value="기타">기타</option>
                </select>
                <input type="number" id="itemPrice" placeholder="실제 구매가 (원)">
                <button onclick="addItem()">품목 추가</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>품목명</th>
                        <th>카테고리</th>
                        <th>실구매가</th>
                        <th>관리</th>
                    </tr>
                <tbody id="itemList">
                    <!-- 자바스크립트로 동적 생성 -->
                </tbody>
            </table>
        </section>

        <!-- 체크리스트 -->
        <section>
            <h2>계약 및 입주 체크리스트</h2>
            <div id="checklistContainer">
                <label><input type="checkbox" class="chk"> 계약 전 등기부등본 확인 및 근저당 확인</label><br>
                <label><input type="checkbox" class="chk"> 수압 체크 및 누수 흔적 확인</label><br>
                <label><input type="checkbox" class="chk"> 옵션 가전 작동 여부 확인</label><br>
                <label><input type="checkbox" class="chk"> 입주 청소 및 도실 소독</label>
            </div>
        </section>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('oneroom_items')) || [];

        function updateBudget() {
            const total = Number(document.getElementById('totalBudget').value);
            const dateStr = document.getElementById('movingDate').value;
            
            // D-Day 계산
            if(dateStr) {
                const diff = new Date(dateStr) - new Date();
                const dday = Math.ceil(diff / (1000 * 60 * 60 * 24));
                document.getElementById('ddayDisplay').innerText = `이사 D-${dday}일`;
            }

            // 지출 계산
            const spent = items.reduce((sum, item) => sum + Number(item.price), 0);
            const remain = total - spent;

            document.getElementById('viewTotal').innerText = total.toLocaleString() + '원';
            document.getElementById('viewSpent').innerText = spent.toLocaleString() + '원';
            document.getElementById('viewRemain').innerText = remain.toLocaleString() + '원';
        }

        function renderItems() {
            const list = document.getElementById('itemList');
            list.innerHTML = '';
            items.forEach((item, index) => {
                list.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>${item.category}</td>
                        <td>${Number(item.price).toLocaleString()}원</td>
                        <td><button class="btn-del" onclick="deleteItem(${index})">삭제</button></td>
                    </tr>
                `;
            });
            updateBudget();
            localStorage.setItem('oneroom_items', JSON.stringify(items));
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const price = document.getElementById('itemPrice').value;

            if(!name || !price) {
                alert('품목명과 가격을 입력해주세요!');
                return;
            }

            items.push({ name, category, price });
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            renderItems();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        // 초기 실행
        renderItems();
    </script>
</body>
</html>
